name: Spot Separation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  separate:
    if: contains(github.event.issue.labels.*.name, 'separate') || startsWith(github.event.issue.title, '[Separate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript
          pip install Pillow

      - name: Parse issue body for spot selections
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            
            const selectedSpots = [];
            const checkboxRegex = /- \[x\]\s+(.+)/gi;
            let match;
            while ((match = checkboxRegex.exec(body)) !== null) {
              const spot = match[1].trim();
              if (spot && !spot.startsWith('http') && !spot.includes('---')) {
                selectedSpots.push(spot);
              }
            }
            
            if (selectedSpots.length === 0) {
              core.setFailed('No spot colors selected.');
              return;
            }
            
            core.setOutput('spots', selectedSpots.join(','));
            core.info(`Selected spots: ${selectedSpots.join(', ')}`);
            
            // Find PDF URLs in issue body: [name.pdf](url)
            const urlRegex = /\[([^\]]*\.pdf)\]\((https:\/\/[^\)]+)\)/gi;
            const pdfs = [];
            while ((match = urlRegex.exec(body)) !== null) {
              pdfs.push({ name: match[1], url: match[2] });
            }
            
            // Also check for direct GitHub URLs
            const directRegex = /(https:\/\/github\.com\/[^\s\)]+\.pdf)/gi;
            while ((match = directRegex.exec(body)) !== null) {
              if (!pdfs.some(p => p.url === match[1])) {
                const name = match[1].split('/').pop();
                pdfs.push({ name, url: match[1] });
              }
            }
            
            if (pdfs.length === 0) {
              core.setFailed('No PDF files found in the issue.');
              return;
            }
            
            // Extract upload folder timestamp from issue body
            const folderMatch = body.match(/Upload folder: uploads\/(\d+)/);
            const timestamp = folderMatch ? folderMatch[1] : '';
            core.setOutput('timestamp', timestamp);
            
            core.setOutput('pdfs', JSON.stringify(pdfs));
            core.info(`Found ${pdfs.length} PDF(s)`);

      - name: Download PDFs
        run: |
          mkdir -p input output
          echo '${{ steps.parse.outputs.pdfs }}' | python3 -c "
          import json, sys, urllib.request, urllib.parse
          pdfs = json.load(sys.stdin)
          for i, pdf in enumerate(pdfs):
              name = pdf['name']
              url = pdf['url']
              # Encode spaces and special chars in the URL path
              parts = urllib.parse.urlsplit(url)
              encoded_path = urllib.parse.quote(parts.path, safe='/:@')
              safe_url = urllib.parse.urlunsplit((parts.scheme, parts.netloc, encoded_path, parts.query, parts.fragment))
              print(f'Downloading: {name}')
              urllib.request.urlretrieve(safe_url, f'input/{name}')
              print(f'  Saved: input/{name}')
          "

      - name: Run spot separation
        run: |
          IFS=',' read -ra SPOTS <<< "${{ steps.parse.outputs.spots }}"
          SPOT_ARGS=""
          for spot in "${SPOTS[@]}"; do
            SPOT_ARGS="$SPOT_ARGS $spot"
          done
          
          python scripts/separate.py input/*.pdf \
            --spots $SPOT_ARGS \
            --dpi 150 \
            --outdir output \
            --gs gs

      - name: Commit output PDFs to repo
        id: commit
        run: |
          TIMESTAMP="${{ steps.parse.outputs.timestamp }}"
          OUTDIR="results/${TIMESTAMP}"
          mkdir -p "$OUTDIR"
          cp output/*.pdf "$OUTDIR/"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "results/"
          git commit -m "Separation results for issue #${{ github.event.issue.number }}"
          git push
          
          # Output the file list for the comment
          echo "outdir=$OUTDIR" >> $GITHUB_OUTPUT
          ls output/*.pdf | while read f; do
            basename "$f"
          done > /tmp/filelist.txt

      - name: Comment on issue with download links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdir = '${{ steps.commit.outputs.outdir }}';
            const files = fs.readdirSync('output').filter(f => f.endsWith('.pdf'));
            
            let body = `## ✅ Separation Complete\n\n`;
            body += `**${files.length} file(s) ready for download:**\n\n`;
            files.forEach(f => {
              const stats = fs.statSync(`output/${f}`);
              const sizeKB = (stats.size / 1024).toFixed(0);
              const rawUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/master/${outdir}/${f}`;
              body += `- [${f}](${rawUrl}) (${sizeKB} KB)\n`;
            });
            body += `\n_Results will be cleaned up automatically._`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ❌ Separation Failed\n\nSomething went wrong. [View the log](${runUrl}) for details.`
            });
