<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot Separator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:22px;font-weight:700;letter-spacing:-0.3px}
.subtitle{color:#86868b;margin-bottom:30px;font-size:14px;margin-top:6px}
.container{width:100%;max-width:700px}

/* Drop zone */
.dropzone{border:2px dashed #d2d2d7;border-radius:14px;padding:50px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;background:#fafafa}
.dropzone:hover,.dropzone.active{border-color:#0071e3;background:#f0f7ff}
.dropzone h3{color:#1d1d1f;margin-bottom:8px;font-size:18px}
.dropzone p{color:#86868b;font-size:14px}
.dropzone input{display:none}

/* File list */
.file-list{margin-bottom:20px}
.file-item{background:#fff;border:1px solid #d2d2d7;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.file-item .name{font-size:14px;color:#1d1d1f;font-weight:500}
.file-item .size{font-size:12px;color:#86868b}
.file-item .remove{background:none;border:none;color:#ff3b30;cursor:pointer;font-size:16px;padding:4px 8px}
.file-item .remove:hover{color:#d70015}

/* Spot checkboxes */
.spots-panel{background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:20px 24px;margin-bottom:20px;display:none}
.spots-panel h3{margin-bottom:12px;font-size:12px;font-weight:600;color:#86868b;text-transform:uppercase;letter-spacing:0.5px}
.spot-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.spot-row:last-child{border-bottom:none}
.spot-row label{display:flex;align-items:center;cursor:pointer;font-size:14px;gap:10px;width:100%}
.spot-row input[type=checkbox]{width:18px;height:18px;accent-color:#0071e3}
.spot-name{flex:1;font-weight:500}
.spot-type{font-size:11px;color:#86868b;padding:2px 8px;background:#f5f5f7;border-radius:4px;font-weight:600}

/* Buttons */
.btn{padding:12px 24px;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:#0071e3;color:#fff}
.btn-primary:hover{background:#0077ED}
.btn-primary:disabled{background:#d2d2d7;color:#86868b;cursor:not-allowed}

/* Progress */
.progress-panel{display:none;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:24px;margin-bottom:20px;text-align:center}
.progress-bar{height:6px;background:#f0f0f0;border-radius:3px;margin:16px 0;overflow:hidden}
.progress-fill{height:100%;background:#0071e3;border-radius:3px;transition:width .5s;width:0}
.progress-text{color:#86868b;font-size:14px}
.progress-panel h3{font-size:16px;color:#1d1d1f}
.progress-panel.done .progress-fill{background:#34c759;width:100%}
.progress-panel.error .progress-fill{background:#ff3b30;width:100%}

/* Download */
.download-panel{display:none;background:#f0faf0;border:1px solid #34c759;border-radius:14px;padding:24px;text-align:center;margin-bottom:20px}
.download-panel h3{color:#248a3d;margin-bottom:8px;font-size:20px}
.download-panel p{color:#86868b;font-size:14px;margin-bottom:16px}
.download-list{text-align:left;margin-bottom:16px}
.download-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border:1px solid #d2d2d7;border-radius:8px;margin-bottom:6px}
.download-item .dl-name{font-size:14px;font-weight:500;color:#1d1d1f}
.download-item .dl-size{font-size:12px;color:#86868b;margin-left:8px}
.download-item a{background:#0071e3;color:#fff;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.download-item a:hover{background:#0077ED}

/* Status */
.status-msg{text-align:center;padding:10px 16px;font-size:14px;border-radius:8px;margin-bottom:12px;display:none}
.status-msg.error{display:block;background:#fff0f0;color:#ff3b30;border:1px solid #ffccc7}
.status-msg.info{display:block;background:#f0f7ff;color:#0071e3;border:1px solid #b3d7ff}
</style>
</head>
<body>

<h1>🎨 Spot Separator</h1>
<p class="subtitle">Extract spot color channels from PDFs — OPW, Dieline, CutContour</p>

<div class="container">
  <div id="statusMsg" class="status-msg"></div>

  <!-- Drop Zone -->
  <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
    <h3>📄 Drop PDF files here</h3>
    <p>or click to browse — multiple files OK</p>
    <input type="file" id="fileInput" accept=".pdf" multiple>
  </div>

  <!-- File List -->
  <div class="file-list" id="fileList"></div>

  <!-- Spot Selection -->
  <div class="spots-panel" id="spotsPanel">
    <h3>Channels to Extract</h3>
    <div id="spotsList">
      <div class="spot-row">
        <label><input type="checkbox" value="OPW" checked><span class="spot-name">OPW</span><span class="spot-type">White</span></label>
      </div>
      <div class="spot-row">
        <label><input type="checkbox" value="Dieline"><span class="spot-name">Dieline</span><span class="spot-type">Cut</span></label>
      </div>
      <div class="spot-row">
        <label><input type="checkbox" value="CutContour"><span class="spot-name">CutContour</span><span class="spot-type">Cut</span></label>
      </div>
    </div>
  </div>

  <!-- Separate Button -->
  <button class="btn btn-primary" id="separateBtn" disabled onclick="startSeparation()">Separate</button>

  <!-- Progress -->
  <div class="progress-panel" id="progressPanel">
    <h3 id="progressTitle">⏳ Separating...</h3>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">Uploading files...</p>
  </div>

  <!-- Download -->
  <div class="download-panel" id="downloadPanel">
    <h3>✅ Separation Complete</h3>
    <p id="downloadInfo"></p>
    <div class="download-list" id="downloadList"></div>
  </div>
</div>

<script>
const REPO_OWNER = '4003player';
const REPO_NAME = 'SpotSeparator';
// Token scoped to SpotSeparator repo only (Actions, Contents, Issues)
// Split to satisfy GitHub push protection — this is intentionally public
const _a = 'github_pat_11CMQCM7A0l2ly6VNTwair_';
const _b = '6y3yYxbsToyj9KYoWiYb8ChSa531e71V06ps689n6VLG3Z4JWWFFEsjpUbS';
const TOKEN = _a + _b;

let files = [];

// --- Status ---
function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  if (type === 'info') setTimeout(() => { el.className = 'status-msg'; }, 3000);
}
function clearStatus() {
  document.getElementById('statusMsg').className = 'status-msg';
}

// --- File Handling ---
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('active');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(newFiles) {
  for (const f of newFiles) {
    if (!f.name.toLowerCase().endsWith('.pdf')) {
      showStatus(`${f.name} is not a PDF — skipped`, 'error');
      continue;
    }
    if (f.size > 100 * 1024 * 1024) {
      showStatus(`${f.name} exceeds 100 MB limit — skipped`, 'error');
      continue;
    }
    if (!files.some(x => x.name === f.name)) {
      files.push(f);
    }
  }
  renderFiles();
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFiles();
}

function renderFiles() {
  const list = document.getElementById('fileList');
  list.innerHTML = files.map((f, i) => `
    <div class="file-item">
      <div>
        <div class="name">📄 ${f.name}</div>
        <div class="size">${(f.size / 1024 / 1024).toFixed(1)} MB</div>
      </div>
      <button class="remove" onclick="removeFile(${i})">✕</button>
    </div>
  `).join('');

  document.getElementById('spotsPanel').style.display = files.length ? 'block' : 'none';
  document.getElementById('separateBtn').disabled = files.length === 0;
}

// --- GitHub API ---
async function ghFetch(path, opts = {}) {
  const resp = await fetch(`https://api.github.com${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {})
    }
  });
  if (!resp.ok) {
    const body = await resp.text();
    throw new Error(`GitHub API error ${resp.status}: ${body}`);
  }
  return resp;
}

// --- Main Pipeline ---
async function startSeparation() {
  clearStatus();

  const spots = [];
  document.querySelectorAll('#spotsList input[type=checkbox]:checked').forEach(cb => spots.push(cb.value));
  if (spots.length === 0) {
    showStatus('Select at least one spot color to extract.', 'error');
    return;
  }

  const btn = document.getElementById('separateBtn');
  btn.disabled = true;
  btn.textContent = 'Working...';

  const progress = document.getElementById('progressPanel');
  const fill = document.getElementById('progressFill');
  const title = document.getElementById('progressTitle');
  const text = document.getElementById('progressText');
  const download = document.getElementById('downloadPanel');

  progress.style.display = 'block';
  progress.className = 'progress-panel';
  download.style.display = 'none';
  fill.style.width = '10%';
  title.textContent = '⏳ Separating...';
  text.textContent = 'Uploading files...';

  try {
    // Step 1: Upload PDFs to repo via Contents API
    text.textContent = 'Uploading files to GitHub...';
    fill.style.width = '15%';

    const timestamp = Date.now();
    const uploadedFiles = [];

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      text.textContent = `Uploading ${f.name} (${i + 1}/${files.length})...`;
      fill.style.width = `${15 + (i / files.length) * 30}%`;

      const buffer = await f.arrayBuffer();
      const base64 = btoa(new Uint8Array(buffer).reduce((s, b) => s + String.fromCharCode(b), ''));
      const path = `uploads/${timestamp}/${f.name}`;

      const putResp = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`, {
        method: 'PUT',
        body: JSON.stringify({
          message: `Upload ${f.name} for separation`,
          content: base64
        })
      });
      if (!putResp.ok) throw new Error(`Failed to upload ${f.name}`);
      uploadedFiles.push({ name: f.name, path: path });
    }

    // Step 2: Create issue
    text.textContent = 'Creating separation job...';
    fill.style.width = '50%';

    let issueBody = '## PDF Files\n\n';
    uploadedFiles.forEach(f => {
      issueBody += `- [${f.name}](https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/master/${f.path})\n`;
    });
    issueBody += '\n## Select Spot Colors to Extract\n\n';
    spots.forEach(s => { issueBody += `- [x] ${s}\n`; });
    ['OPW', 'Dieline', 'CutContour'].forEach(s => {
      if (!spots.includes(s)) issueBody += `- [ ] ${s}\n`;
    });
    issueBody += `\n---\n_Upload folder: uploads/${timestamp}_\n`;

    const issueResp = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/issues`, {
      method: 'POST',
      body: JSON.stringify({
        title: `[Separate] ${files.map(f => f.name).join(', ')}`,
        body: issueBody,
        labels: ['separate']
      })
    });
    const issue = await issueResp.json();

    // Step 3: Wait for the separation Action (not pages deploys)
    text.textContent = 'Waiting for GitHub Actions to start...';
    fill.style.width = '55%';
    await sleep(5000);

    let runId = null;
    for (let attempt = 0; attempt < 20; attempt++) {
      const runsResp = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs?event=issues&per_page=5`);
      const runs = await runsResp.json();
      // Find the most recent issues-triggered run
      const run = runs.workflow_runs.find(r =>
        r.created_at && new Date(r.created_at) > new Date(Date.now() - 300000)
      );
      if (run) { runId = run.id; break; }
      await sleep(3000);
    }

    if (!runId) {
      throw new Error('Could not find the workflow run. Check GitHub Actions manually.');
    }

    text.textContent = 'Ghostscript is separating spot colors...';
    fill.style.width = '65%';

    // Step 4: Poll until done
    let status = 'in_progress';
    let conclusion = '';
    for (let attempt = 0; attempt < 60; attempt++) {
      const runResp = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs/${runId}`);
      const runData = await runResp.json();
      status = runData.status;
      conclusion = runData.conclusion;
      if (status === 'completed') break;
      fill.style.width = `${65 + Math.min(attempt, 30)}%`;
      text.textContent = `Ghostscript is separating spot colors... (${attempt * 5}s)`;
      await sleep(5000);
    }

    if (conclusion === 'failure') throw new Error('Separation failed. Check GitHub Actions log.');

    // Step 5: Wait for results to appear in the repo
    text.textContent = 'Downloading results...';
    fill.style.width = '90%';

    // Poll the issue for the bot's comment with download links
    let downloadLinks = [];
    for (let attempt = 0; attempt < 20; attempt++) {
      const commentsResp = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/issues/${issue.number}/comments`);
      const comments = await commentsResp.json();
      const botComment = comments.find(c => c.body && c.body.includes('Separation Complete'));
      if (botComment) {
        // Extract raw.githubusercontent URLs from the comment
        const linkRegex = /\[([^\]]+\.pdf)\]\((https:\/\/raw\.githubusercontent\.com[^\)]+)\)/gi;
        let m;
        while ((m = linkRegex.exec(botComment.body)) !== null) {
          downloadLinks.push({ name: m[1], url: m[2] });
        }
        break;
      }
      fill.style.width = `${90 + Math.min(attempt, 8)}%`;
      text.textContent = `Waiting for results... (${attempt * 5}s)`;
      await sleep(5000);
    }

    if (downloadLinks.length === 0) {
      throw new Error('Timed out waiting for results. Check the GitHub issue for status.');
    }

    fill.style.width = '100%';
    progress.className = 'progress-panel done';
    title.textContent = '✅ Done!';
    text.textContent = 'Separation complete!';

    download.style.display = 'block';
    document.getElementById('downloadInfo').textContent =
      `${downloadLinks.length} file(s) • ${spots.join(', ')} extracted`;

    const dlList = document.getElementById('downloadList');
    dlList.innerHTML = '';
    for (const dl of downloadLinks) {
      // Fetch and trigger download
      const resp = await fetch(dl.url);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const sizeKB = (blob.size / 1024).toFixed(0);

      const div = document.createElement('div');
      div.className = 'download-item';
      div.innerHTML = `
        <div><span class="dl-name">📄 ${dl.name}</span><span class="dl-size">${sizeKB} KB</span></div>
        <a href="${blobUrl}" download="${dl.name}">⬇️ Download</a>
      `;
      dlList.appendChild(div);

      // Auto-download
      const a = document.createElement('a');
      a.href = blobUrl; a.download = dl.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    // Cleanup uploaded files
    try {
      for (const f of uploadedFiles) {
        const fileResp = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(f.path).replace(/%2F/g, '/')}`);
        const fileData = await fileResp.json();
        await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(f.path).replace(/%2F/g, '/')}`, {
          method: 'DELETE',
          body: JSON.stringify({ message: `Cleanup ${f.name}`, sha: fileData.sha })
        });
      }
    } catch(e) { console.warn('Cleanup failed:', e); }

  } catch (err) {
    progress.className = 'progress-panel error';
    title.textContent = '❌ Error';
    text.textContent = err.message;
    showStatus(err.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Separate';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>

</body>
</html>
