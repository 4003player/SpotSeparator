<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.subtitle{color:#86868b;margin-bottom:30px;font-size:14px;margin-top:6px}
.container{width:100%;max-width:700px}

.dropzone{border:2px dashed #d2d2d7;border-radius:14px;padding:50px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;background:#fafafa}
.dropzone:hover,.dropzone.active{border-color:#0071e3;background:#f0f7ff}
.dropzone h3{color:#1d1d1f;margin-bottom:8px;font-size:18px}
.dropzone p{color:#86868b;font-size:14px}
.dropzone input{display:none}

.file-list{margin-bottom:20px}
.file-item{background:#fff;border:1px solid #d2d2d7;border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.file-item .name{font-size:14px;color:#1d1d1f;font-weight:500}
.file-item .size{font-size:12px;color:#86868b}
.file-item .remove{background:none;border:none;color:#ff3b30;cursor:pointer;font-size:16px;padding:4px 8px}
.file-item .remove:hover{color:#d70015}

.card{background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:20px 24px;margin-bottom:20px;display:none}
.card h3{margin-bottom:12px;font-size:12px;font-weight:600;color:#86868b;text-transform:uppercase;letter-spacing:.5px}
.spot-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
.spot-row:last-child{border-bottom:none}
.spot-row label{display:flex;align-items:center;cursor:pointer;font-size:14px;gap:10px;width:100%}
.spot-row input[type=checkbox]{width:18px;height:18px;accent-color:#0071e3}
.spot-name{flex:1;font-weight:500}
.spot-type{font-size:11px;color:#86868b;padding:2px 8px;background:#f5f5f7;border-radius:4px;font-weight:600}
.opt-row{display:flex;align-items:center;gap:8px;padding:10px 0;flex-wrap:wrap}
.opt-row label{font-size:13px;color:#1d1d1f;cursor:pointer;display:flex;align-items:center;gap:6px}
.opt-row input[type=checkbox]{width:15px;height:15px;accent-color:#0071e3}
.opt-row select,.opt-row input[type=number]{padding:6px 10px;border:1px solid #d2d2d7;border-radius:8px;font-size:13px;background:#fafafa;font-family:inherit;width:90px}
.opt-note{font-size:11px;color:#86868b;margin-top:4px}

.btn{padding:12px 24px;border-radius:10px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:#0071e3;color:#fff}
.btn-primary:hover{background:#0077ED}
.btn-primary:disabled{background:#d2d2d7;color:#86868b;cursor:not-allowed}

.progress-panel{display:none;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:24px;margin-bottom:20px;text-align:center}
.progress-bar{height:6px;background:#f0f0f0;border-radius:3px;margin:16px 0;overflow:hidden}
.progress-fill{height:100%;background:#0071e3;border-radius:3px;transition:width .5s;width:0}
.progress-text{color:#86868b;font-size:14px}
.progress-panel h3{font-size:16px;color:#1d1d1f}
.progress-panel.done .progress-fill{background:#34c759;width:100%}
.progress-panel.error .progress-fill{background:#ff3b30;width:100%}

.download-panel{display:none;background:#fff;border:1px solid #d2d2d7;border-radius:14px;padding:24px;text-align:center;margin-bottom:20px}
.download-panel h3{color:#248a3d;margin-bottom:8px;font-size:20px}
.download-panel p{color:#86868b;font-size:14px;margin-bottom:16px}
.download-list{text-align:left;margin-bottom:16px}
.download-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border:1px solid #d2d2d7;border-radius:8px;margin-bottom:6px}
.download-item .dl-name{font-size:14px;font-weight:500;color:#1d1d1f}
.download-item .dl-size{font-size:12px;color:#86868b;margin-left:8px}
.download-item a{color:#0071e3;font-size:14px;font-weight:600;text-decoration:none}
.vector-tag{font-size:10px;color:#fff;background:#6366f1;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}

.status-msg{font-size:13px;margin-top:10px;min-height:20px;text-align:center}
.status-msg.error{color:#ff3b30}
.status-msg.info{color:#0071e3}

.footer-note{font-size:11px;color:#86868b;text-align:center;margin-top:24px}
</style>

<body>
<h1>🎨 Spot Separator</h1>
<p class="subtitle">Extract spot color channels from PDFs — OPW, Dieline, CutContour</p>

<div class="container">
  <div class="dropzone" id="dropzone">
    <h3>📄 Drop PDF files here</h3>
    <p>or click to browse — multiple files OK</p>
    <input type="file" id="fileInput" accept=".pdf" multiple>
  </div>

  <div class="file-list" id="fileList"></div>

  <div class="card" id="spotsPanel">
    <h3>Channels to Extract</h3>
    <div id="spotsList"></div>
  </div>

  <div class="card" id="optionsPanel">
    <h3>Options</h3>
    <div class="opt-row">
      <label><input type="checkbox" id="optMarks" checked> Strip marks &amp; bleeds layer</label>
    </div>
    <div class="opt-row">
      <label><input type="checkbox" id="opt4cp" checked> Include 4CP (process) plate</label>
    </div>
    <div class="opt-row">
      <label style="width:auto">Plate DPI</label>
      <input type="number" id="optDpi" value="150" min="36" max="600" step="1">
      <span class="opt-note">150 for wide format</span>
    </div>
  </div>

  <button class="btn btn-primary" id="separateBtn" disabled onclick="startSeparation()">Separate</button>

  <div class="progress-panel" id="progressPanel">
    <h3 id="progressTitle">⏳ Separating...</h3>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p class="progress-text" id="progressText">Uploading files...</p>
  </div>

  <div class="download-panel" id="downloadPanel">
    <h3>✅ Separation Complete</h3>
    <p id="downloadInfo"></p>
    <div class="download-list" id="downloadList"></div>
  </div>

  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
// ── Server endpoint ──
// Production: https://spot-separator-server.fly.dev (scale-to-zero, first request after idle may take a few seconds)
const API_BASE = 'https://spot-separator-server.fly.dev';

let files = [];

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (type || '');
  if (type === 'info') setTimeout(() => { el.className = 'status-msg'; }, 4000);
}
function clearStatus() {
  document.getElementById('statusMsg').className = 'status-msg';
}

// ── File handling ──
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('active'); addFiles(e.dataTransfer.files); });
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(newFiles) {
  for (const f of newFiles) {
    if (!f.name.toLowerCase().endsWith('.pdf')) {
      showStatus(`${f.name}: not a PDF`, 'error');
      continue;
    }
    if (files.some(x => x.name === f.name)) continue;
    files.push(f);
  }
  renderFiles();
  if (files.length) discoverSpots();
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFiles();
  if (files.length) discoverSpots();
  else { document.getElementById('spotsPanel').style.display = 'none'; }
}

function renderFiles() {
  const list = document.getElementById('fileList');
  list.innerHTML = files.map((f, i) => `
    <div class="file-item">
      <span><span class="name">${f.name}</span> <span class="size">${(f.size/1048576).toFixed(1)} MB</span></span>
      <button class="remove" onclick="removeFile(${i})">✕</button>
    </div>`).join('');
  document.getElementById('separateBtn').disabled = files.length === 0;
  document.getElementById('optionsPanel').style.display = files.length ? 'block' : 'none';
}

// ── Spot discovery: hit /spots for each file, union the channels ──
let discoveredSpots = [];
let spotTypes = { OPW: 'White', Dieline: 'Cut', CutContour: 'Cut', CutContour: 'Cut' };
const KNOWN_CUT = ['dieline','cutcontour','thrucut','thru-cut','diecut','kisscut','kiss-cut','v-cut','score','crease','route','engrave','drill','punch','perf'];

function classify(name) {
  const n = name.toLowerCase();
  if (n.includes('opw') || n.includes('white')) return 'White';
  if (KNOWN_CUT.some(k => n.includes(k))) return 'Cut';
  return 'Spot';
}

async function discoverSpots() {
  clearStatus();
  const panel = document.getElementById('spotsPanel');
  panel.style.display = 'block';
  document.getElementById('spotsList').innerHTML = '<p style="color:#86868b;font-size:13px">Scanning for spot channels…</p>';
  const union = new Map();
  for (const f of files) {
    try {
      const fd = new FormData();
      fd.append('file', f);
      const resp = await fetch(API_BASE + '/spots', { method: 'POST', body: fd });
      if (!resp.ok) throw new Error(await resp.text());
      const data = await resp.json();
      for (const s of data.separations || []) {
        if (!union.has(s)) union.set(s, classify(s));
      }
    } catch (e) {
      showStatus(`Spot scan failed for ${f.name} — is the separator server running?`, 'error');
      panel.style.display = 'none';
      return;
    }
  }
  discoveredSpots = [...union.keys()];
  document.getElementById('spotsList').innerHTML = discoveredSpots.length
    ? discoveredSpots.map((s, i) => `
      <div class="spot-row">
        <label><input type="checkbox" value="${s}" ${i === 0 ? 'checked' : ''}>
        <span class="spot-name">${s}</span>
        <span class="spot-type">${union.get(s)}</span></label>
      </div>`).join('')
    : '<p style="color:#86868b;font-size:13px">No spot channels found in these files.</p>';
}

// ── Main pipeline ──
async function startSeparation() {
  clearStatus();
  const spots = [];
  document.querySelectorAll('#spotsList input[type=checkbox]:checked').forEach(cb => spots.push(cb.value));
  if (spots.length === 0) { showStatus('Select at least one spot color to extract.', 'error'); return; }

  const marks = document.getElementById('optMarks').checked ? 'off' : 'on';
  const inc4cp = document.getElementById('opt4cp').checked ? 'on' : 'off';
  const dpi = parseInt(document.getElementById('optDpi').value) || 150;

  const btn = document.getElementById('separateBtn');
  btn.disabled = true; btn.textContent = 'Working...';

  const progress = document.getElementById('progressPanel');
  const fill = document.getElementById('progressFill');
  const title = document.getElementById('progressTitle');
  const text = document.getElementById('progressText');
  const download = document.getElementById('downloadPanel');

  progress.style.display = 'block';
  progress.className = 'progress-panel';
  download.style.display = 'none';
  title.textContent = '⏳ Separating...';
  text.textContent = 'Uploading files...';
  fill.style.width = '10%';

  let doneCount = 0;
  const downloadItems = [];

  try {
    for (const f of files) {
      text.textContent = `Separating ${f.name} (${doneCount + 1}/${files.length})...`;
      const fd = new FormData();
      fd.append('file', f);
      fd.append('spots', spots.join(','));
      fd.append('dpi', dpi);
      fd.append('marks', marks);
      fd.append('include_4cp', inc4cp);

      const resp = await fetch(API_BASE + '/separate', { method: 'POST', body: fd });
      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`${f.name}: ${errText.slice(0, 200)}`);
      }
      const blob = await resp.blob();
      const report = (resp.headers.get('X-Separations') || '').split(',').filter(Boolean);
      const missing = (resp.headers.get('X-Missing') || '').split(',').filter(Boolean);
      downloadItems.push({ name: f.name.replace(/\.pdf$/i, '') + '_separations.zip', blob, report, missing });
      doneCount++;
      fill.style.width = `${10 + (doneCount / files.length) * 85}%`;
    }

    title.textContent = '✅ Done!';
    text.textContent = 'Separation complete!';
    progress.className = 'progress-panel done';

    download.style.display = 'block';
    document.getElementById('downloadInfo').textContent =
      `${downloadItems.length} file(s) • ${spots.join(', ')} extracted`;

    const dlList = document.getElementById('downloadList');
    dlList.innerHTML = '';
    for (const dl of downloadItems) {
      const url = URL.createObjectURL(dl.blob);
      const sizeKB = (dl.blob.size / 1024).toFixed(0);
      const isVec = dl.report.some(r => r.includes('vector'));
      const div = document.createElement('div');
      div.className = 'download-item';
      div.innerHTML = `
        <div><span class="dl-name">📦 ${dl.name}</span>${isVec ? '<span class="vector-tag">vector die</span>' : ''}<span class="dl-size">${sizeKB} KB</span></div>
        <a href="${url}" download="${dl.name}">⬇️ Download</a>`;
      dlList.appendChild(div);

      // auto-download
      const a = document.createElement('a');
      a.href = url; a.download = dl.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    if (downloadItems.some(d => d.missing.length)) {
      showStatus('Note: some requested spots were not found in every file.', 'info');
    }
  } catch (err) {
    progress.className = 'progress-panel error';
    title.textContent = '❌ Error';
    text.textContent = err.message;
    showStatus(err.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Separate';
}
</script>
